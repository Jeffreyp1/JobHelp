<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Greenhouse Application — Acme</title></head>
<body>
  <h1>Apply for Software Engineer at Acme</h1>
  <!-- decoy: a greenhouse-matching iframe with no form; surfaceOf must ignore it -->
  <iframe id="grnhse_iframe" srcdoc="<p>not the form</p>"></iframe>
  <form id="application_form">
    <div>
      <label for="first_name">First Name *</label>
      <input id="first_name" name="job_application[first_name]" type="text" required>
    </div>
    <div>
      <label for="last_name">Last Name *</label>
      <input id="last_name" name="job_application[last_name]" type="text" required>
    </div>
    <div>
      <label for="email">Email *</label>
      <input id="email" name="job_application[email]" type="email" required>
    </div>
    <div>
      <label for="phone">Phone</label>
      <input id="phone" name="job_application[phone]" type="tel">
    </div>
    <div>
      <label for="resume">Resume/CV</label>
      <input id="resume" name="job_application[resume]" type="file">
    </div>
    <button id="submit_app" type="submit">Submit Application</button>
  </form>
</body>
</html>
